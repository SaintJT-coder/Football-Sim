name: Gridiron GM validation
on:
  push:
    branches: [main, feature/franchise-systems-integration]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all JavaScript syntax
        run: |
          set -eu
          for file in *.js; do node --check "$file"; done
      - name: Check page and script references
        run: |
          python3 - <<'PY'
          import re,pathlib
          html=pathlib.Path('index.html').read_text()
          for src in re.findall(r'<script\s+src="([^"]+)"',html):
              assert pathlib.Path(src).is_file(),f'Missing script: {src}'
          assert 'franchise-systems.js' in html
          assert 'franchise-integration.js' in html
          print('Script references validated')
          PY
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile browser regression
        run: node tests/smoke.cjs
