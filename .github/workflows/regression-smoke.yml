name: Gridiron GM regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and module dependencies
        run: node tests/source-smoke.cjs
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public GitHub Pages delivery
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          base='https://saintjt-coder.github.io/Football-Sim/'
          for name in ['','index.html','gridiron-core.js','menu.js','engine.js','presentation-immersion.js']:
              url=base+name
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Gridiron-QA'}),timeout=15) as resp:
                      body=resp.read(1024)
                      print('LIVE',resp.status,url,'bytes>='+str(len(body)),'head='+repr(body[:60]))
                      assert resp.status==200 and len(body)>0
              except Exception as error:
                  print('LIVE DELIVERY FAILURE',url,repr(error))
                  raise
          PY
      - name: Run existing mobile browser regression
        run: |
          node tests/smoke.cjs
          node tests/button-interaction-qa.cjs
