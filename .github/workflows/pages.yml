name: Deploy Gridiron GM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s index.html
          test -s expansion.js
          node --check expansion.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          match=re.search(r'<script>(.*?)</script>',html,re.S)
          assert match, 'Inline app script missing'
          Path('/tmp/gridiron-inline.js').write_text(match.group(1))
          PY
          node --check /tmp/gridiron-inline.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'expansion.js' in html
          assert '</html>' in html
          print('Static site validation passed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
