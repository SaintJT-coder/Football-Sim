name: Gridiron GM — Franchise QA

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.html'
      - '**.css'
      - '.github/workflows/franchise-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  franchise-tests:
    name: JavaScript syntax and franchise regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -maxdepth 2 -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Run Priority 3–7 regression tests
        shell: bash
        run: |
          set +e
          exit_code=0
          for testfile in tests/weekly-gameplan-priority3-smoke.js \
                          tests/contracts-priority4-smoke.js \
                          tests/draft-priority5-smoke.js \
                          tests/league-narratives-priority6-smoke.js \
                          tests/presentation-priority7-smoke.js \
                          tests/qa-menu-roster-scouting-smoke.js \
                          tests/full-engine-integration-smoke.js \
                          tests/save-recovery-qa-smoke.js \
                          tests/legacy-save-import-qa-smoke.js \
                          tests/save-storage-order-qa-smoke.js \
                          tests/startup-save-qa-smoke.js \
                          tests/draft-animation-qa-smoke.js \
                          tests/draft-presentation-qa-smoke.js \
                          tests/branch-delete-qa-smoke.js \
                          tests/multiseason-stress-qa-smoke.js \
                          tests/retirement-archive-qa-smoke.js \
                          tests/scheme-cache-qa-smoke.js \
                          tests/save-retention-qa-smoke.js \
                          tests/roster-autocuts-qa-smoke.js \
                          tests/freeagent-lifecycle-qa-smoke.js \
                          tests/full-page-startup-qa-smoke.js; do
            echo "::group::Running $testfile"
            node "$testfile"
            result=$?
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then
              echo "::error title=Regression test failure::$testfile (exit $result)"
              exit_code=1
            fi
          done
          exit "$exit_code"
