:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f8;background:#070b15}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#1a202c;color:#e8edf6}button:hover{filter:brightness(1.18)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#10b98c;color:#03130f;font-weight:750}.blue{background:#11a6e5;color:#03131c}.white{background:#f6f8fa;color:#101827}.danger{color:#ff6b87}.green{color:#58dbaf}.muted{color:#8c9bb1}.small{font-size:12px}.eyebrow{letter-spacing:4px;color:#12b990;font-size:11px;text-transform:uppercase;font-weight:700}.shell{display:flex;min-height:100vh}.sidebar{width:250px;flex-shrink:0;background:#0b1120;border-right:1px solid #202b3b;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:850;margin:4px 8px 27px;display:flex;align-items:center;gap:10px}.logo{background:linear-gradient(135deg,#42dca2,#089ce0);padding:12px;border-radius:9px;color:#001c21}.brand small{display:block;color:#8798ad;letter-spacing:3px;font-size:9px;font-weight:400}.nav{display:block;width:100%;text-align:left;background:transparent;color:#95a4ba;margin:3px 0;padding:12px 13px}.nav.active{background:#252c3b;color:white;outline:1px solid #384354}.main{padding:34px;max-width:1300px;width:100%;margin:auto}.heading{font-size:38px;letter-spacing:-1.4px;margin:12px 0 9px}.sub{color:#93a2b7;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#10151e;border:1px solid #29303c;border-radius:16px;padding:20px;min-width:0}.card h3{margin:0 0 15px}.statlabel{color:#8192aa;letter-spacing:2px;font-size:11px;text-transform:uppercase}.value{font-size:27px;font-weight:800;margin:8px 0}.section{margin:34px 0 14px;color:#7e8da4;letter-spacing:4px;font-size:11px}.player{display:flex;align-items:center;gap:15px;background:#10151e;border:1px solid #252b36;border-radius:14px;padding:14px 16px;margin:8px 0;min-width:0}.rating{border-radius:10px;background:#55d4a7;color:#06231e;font-size:20px;font-weight:850;min-width:47px;height:47px;display:grid;place-items:center}.rating.mid{background:#53bce9;color:#092237}.rating.low{background:#b8c7d9;color:#192536}.avatar{font-size:28px;background:#101c31;border-radius:50%;width:45px;height:45px;display:grid;place-items:center}.player .name{flex:1;min-width:0}.player .name strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .name span{font-size:12px;color:#8798ae}.money{text-align:right;min-width:80px}.money strong{display:block}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.filters button.selected{background:#f8fafc;color:#121a29}.wide{width:100%;margin:14px 0}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:13px 10px;border-bottom:1px solid #232b36;text-align:left}.table th{color:#90a1b7;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.progress{height:7px;background:#222a34;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#30c394}.pill{padding:6px 9px;background:#222a38;border-radius:6px;font-size:12px}.input{padding:12px;background:#151c28;color:white;border:1px solid #303b4a;border-radius:8px;max-width:100%}.banner{background:#08252a;border:1px solid #15514c;padding:22px;border-radius:16px}.notice{padding:14px;border:1px solid #6a2d44;background:#2b1420;color:#ffbbca;border-radius:12px}.mobilebar{display:none}@media(max-width:850px){.sidebar{display:none}.mobilebar{display:flex;position:sticky;top:0;background:#0b1120;z-index:5;padding:12px;gap:10px;align-items:center;border-bottom:1px solid #29303c}.main{padding:22px 15px}.grid,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two{grid-template-columns:1fr}.heading{font-size:30px}.player{gap:9px;padding:10px}.money{min-width:60px;font-size:12px}}@media(max-width:450px){.grid,.grid.three{grid-template-columns:1fr 1fr}.value{font-size:22px}.player .avatar{display:none}.player .money:nth-last-child(2){display:none}}

</style></head><body><div class="mobilebar"><button onclick="toggleMenu()">☰</button><b>🏈 GRIDIRON GM</b><span id="mobileSeason" class="muted small"></span></div><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">G</span><span>GRIDIRON GM<small>FRANCHISE SIM</small></span></div><div id="nav"></div></aside><main class="main" id="app"></main></div><script>
const POS=['QB','RB','WR','TE','OL','DL','LB','CB','S','K'],NAMES=['Ledger Havard','Damari Brackett','Silas Tillman','Terrell Boudreaux','Corbin Prescott','Beau Prescott','Tyrese Ferrand','Kellen Sutcliffe','Jermaine Amaro','Dax Larkin','Shay Vaughn','Nico Ashford','Jalen Vaughn','Rhett Deveraux','Damari Oy elaran','Jalen Cauley','Kellen Trammell','Zion Hollins','Keon Renner','Nico Marchetti','Trey Larkin','Lorenzo Ashford','Rhett Kingsley','Silas Boone','Dax Marchetti','Nico Salinas','Emory Ferrand','Shay Petrov','Caleb Castor','Devon Sanders'];
const TEAMS=[["ARC","Arcadia Sentinels","Union North"],["CED","Cedar Falls Timberwolves","Union North"],["BAY","Baytown Krakens","Union North"],["ELD","Eldorado Outlaws","Union North"],["DUN","Dunmore Ironsides","Union South"],["FTV","Fort Vernon Gladiators","Union South"],["GLN","Glenport Mariners","Union South"],["HAR","Harrow City Ravagers","Union South"],["IRN","Ironwood Grizzlies","Union East"],["LKS","Lakeshore Thunder","Union East"],["KNG","Kingsmill Regals","Union East"],["JAS","Jasper Bay Stingrays","Union East"],["ASH","Ashford Phantoms","Union West"],["BLF","Bluefield Falcons","Union West"],["CRS","Crescent City Comets","Union West"],["DRK","Drakeport Dragons","Union West"],["EMB","Ember Falls Firebirds","Liberty North"],["FRG","Frostgate Wolves","Liberty North"],["GRV","Grandview Vipers","Liberty North"],["HIL","Highland Knights","Liberty North"],["IVY","Ivystone Guardians","Liberty South"],["JCT","Junction City Jets","Liberty South"],["KST","Keystone Cyclones","Liberty South"],["LUM","Lumen City Lights","Liberty South"],["MST","Mistwood Foxes","Liberty East"],["NRD","North Ridge Bears","Liberty East"],["OAK","Oakmont Stags","Liberty East"],["PRT","Portside Pirates","Liberty East"],["QRY","Quarry City Titans","Liberty West"],["RVD","Riverdale Raptors","Liberty West"],["SVL","Silverlake Sharks","Liberty West"],["TMR","Timber Ridge Mustangs","Liberty West"]];
const pages=['Dashboard','Fantasy Draft','Scouting','Draft Board','Roster','Front Office','Player Market','Trade Center','Salary Cap','Schedule','Standings','Awards','Finances','League History','Legends','Hall of Fame','Animation'];
const $=id=>document.getElementById(id),money=n=>'$'+n.toFixed(1)+'M',rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function generate(){let players=[];for(let i=0;i<TEAMS.length*30;i++){let pos=POS[i%10],rating=Math.max(48,Math.min(96,Math.round(69+Math.random()*25-(i/(TEAMS.length*30))*16)));players.push({id:i,name:NAMES[i%NAMES.length]+(i>=NAMES.length?' '+String.fromCharCode(65+Math.floor(i/NAMES.length)):''),pos,age:21+rand(0,14),rating,pot:Math.min(99,rating+rand(1,12)),salary:+(Math.pow(rating/80,5)*11).toFixed(1),team:Math.floor(i/30),stats:{yards:0,td:0,tackles:0,sacks:0},injury:0,years:rand(1,4),target:false});}return players}
function fresh(){return {year:2026,week:1,team:0,cash:120,cap:350,players:generate(),results:[],history:[],news:[],upgrades:{},coach:75,scoutNotes:{},draftDone:true,champions:[],awards:[],retired:[],selectedTrade:1}}
let state;try{state=JSON.parse(localStorage.getItem('gridiron-gm-save'))||fresh()}catch{state=fresh()}let page='Dashboard',filter='ALL',search='',ratingFilter=0,targetsOnly=false,selectedWeek=state.week,tradeOut=[],tradeIn=[];
function save(){localStorage.setItem('gridiron-gm-save',JSON.stringify(state))}function roster(t=state.team){return state.players.filter(p=>p.team===t)}function payroll(t=state.team){return roster(t).reduce((a,p)=>a+p.salary,0)}function capspace(){return state.cap-payroll()}function title(t,sub,eyebrow='FRANCHISE'){return '<div class="eyebrow">'+eyebrow+'</div><h1 class="heading">'+t+'</h1><p class="sub">'+sub+'</p>'}function metric(k,v,extra=''){return '<div class="card"><div class="statlabel">'+k+'</div><div class="value">'+v+'</div><div class="small muted">'+extra+'</div></div>'}function heading(t){return '<div class="section">'+t+'</div>'}function rating(p){return '<span class="rating '+(p.rating<70?'low':p.rating<80?'mid':'')+'">'+p.rating+'</span>'}function playerRow(p,action='',label=''){return '<div class="player">'+rating(p)+'<div class="avatar">👨🏻</div><span class="pill">'+p.pos+'</span><div class="name"><strong>'+p.name+'</strong><span>Age '+p.age+' · POT '+p.pot+(p.injury?' · 🩹 '+p.injury+'w':'')+'</span></div><div class="money"><span class="muted small">Salary</span><strong>'+money(p.salary)+'</strong></div><div class="money"><span class="muted small">Market</span><strong class="green">'+money(p.salary*1.8)+'</strong></div>'+(action?'<button class="'+(label==='Sign'?'blue':'white')+'" onclick="'+action+'">'+label+'</button>':'')+'</div>'}function filters(){return '<div class="filters">'+['ALL',...POS].map(x=>'<button class="'+(filter===x?'selected':'')+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join('')+'</div>'}function setFilter(x){filter=x;render()}function listed(arr){return arr.filter(p=>(filter==='ALL'||p.pos===filter)&&p.name.toLowerCase().includes(search.toLowerCase())&&p.rating>=ratingFilter&&(!targetsOnly||p.target))}function notice(msg){alert(msg)}const draftNavIconPositions={"Dashboard":-1,"Fantasy Draft":1,"Scouting":2,"Draft Board":3,"Roster":4,"Front Office":5,"Player Market":6,"Trade Center":7,"Salary Cap":8,"Schedule":9,"Standings":10,"Awards":11,"Finances":12,"League History":13,"Legends":14,"Hall of Fame":15,"Animation":16};
const draftNavFallback=["▦","▤","◎","▦","♧","▣","▤","⇄","⚖","▦","🏆","♙","▣","◴","♢","♛","▶"];
function nav(){ $('nav').innerHTML=pages.map((p,i)=>{
 const n=draftNavIconPositions[p];
 const fallback=draftNavFallback[i]||'◆';
 const icon=n===-1?'<img src="dashboard-icon.jpg" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:5px;vertical-align:middle" onerror="this.replaceWith(document.createTextNode(\'▦\'))">':n===undefined?'<span class="nav-original-icon">'+fallback+'</span>':'<span class="nav-sprite-icon" style="--sprite-x:'+(-((n%4)*44))+'px;--sprite-y:'+(-Math.floor(n/4)*44)+'px" aria-hidden="true"><span class="nav-original-icon">'+fallback+'</span></span>';
 return '<button class="nav '+(p===page?'active':'')+'" onclick="go('+i+')">'+icon+' &nbsp; '+p+'</button>'
 }).join('')+'<button class="nav" onclick="openGridironMenu()">⌂ &nbsp; Main Menu</button>'}
function go(i){page=pages[i];filter='ALL';search='';render();window.scrollTo(0,0);if(innerWidth<851)$('sidebar').style.display='none'}function toggleMenu(){let s=$('sidebar');s.style.display=s.style.display==='block'?'none':'block';if(s.style.display==='block'){s.style.position='fixed';s.style.zIndex='10';s.style.top='55px'}}
function dashboard(){let r=roster(),avg=Math.round(r.reduce((a,p)=>a+p.rating,0)/(r.length||1)),rec=record(state.team);return title(TEAMS[state.team][1],TEAMS[state.team][2]+' · '+state.year+' SEASON · WEEK '+state.week,'FRANCHISE HQ')+'<div class="banner row"><div><h2>'+TEAMS[state.team][1]+'</h2><span class="muted">'+TEAMS[state.team][2]+'</span></div><div><h2>'+rec.w+'-'+rec.l+'</h2><span class="muted">Season record</span></div></div><button class="primary wide" onclick="simulate()">Simulate Week '+state.week+'</button><div class="grid">'+metric('Cash',money(state.cash))+metric('Cap Space',money(capspace()))+metric('Roster',r.length+'/53')+metric('Coaching',state.coach)+'</div>'+heading('TEAM MANAGEMENT')+'<div class="grid">'+metric('Overall',avg)+metric('Offense',Math.round(avg-3))+metric('Defense',Math.round(avg+3))+metric('Special',Math.round(avg-8))+'</div>'+heading('TEAM LEADERS')+r.sort((a,b)=>b.rating-a.rating).slice(0,5).map(p=>playerRow(p)).join('')+heading('LEAGUE WIRE')+state.news.slice(0,8).map(n=>'<div class="card" style="margin:8px 0">📰 '+n+'</div>').join('')}
function record(t){let games=state.results.filter(g=>g.year===state.year&&(g.a===t||g.b===t));return {w:games.filter(g=>(g.a===t?g.sa>g.sb:g.sb>g.sa)).length,l:games.filter(g=>(g.a===t?g.sa<g.sb:g.sb<g.sa)).length}}
function simulate(){if(state.week>18){endSeason();return}let pool=[...Array(TEAMS.length).keys()].sort(()=>Math.random()-.5);for(let i=0;i<TEAMS.length;i+=2){let a=pool[i],b=pool[i+1],ra=roster(a).reduce((x,p)=>x+p.rating,0)/Math.max(1,roster(a).length),rb=roster(b).reduce((x,p)=>x+p.rating,0)/Math.max(1,roster(b).length);let sa=Math.max(3,Math.round(21+(ra-rb)*.7+rand(-13,13))),sb=Math.max(3,Math.round(21+(rb-ra)*.7+rand(-13,13)));if(sa===sb)sa+=3;state.results.push({year:state.year,week:state.week,a,b,sa,sb});for(let t of [a,b])for(let p of roster(t)){p.stats.yards+=p.pos==='QB'?rand(120,350):['RB','WR','TE'].includes(p.pos)?rand(5,110):0;p.stats.td+=['QB','RB','WR','TE'].includes(p.pos)?rand(0,2):0;p.stats.tackles+=['DL','LB','CB','S'].includes(p.pos)?rand(1,9):0;p.stats.sacks+=['DL','LB'].includes(p.pos)?rand(0,1):0;if(Math.random()<.007){p.injury=rand(1,5);state.news.unshift(p.name+' sidelined '+p.injury+' weeks')}}}state.cash+=rand(2,8);state.players.forEach(p=>p.injury=Math.max(0,p.injury-1));state.news.unshift('Week '+state.week+' results are final.');state.week++;selectedWeek=state.week;save();render()}
function endSeason(){let ranks=[...Array(TEAMS.length).keys()].sort((a,b)=>record(b).w-record(a).w);let champ=ranks[0];state.history.push({year:state.year,champ:TEAMS[champ][1],runner:TEAMS[ranks[1]][1]});state.champions.push(champ);let best=[...state.players].sort((a,b)=>b.stats.yards+b.stats.td*100-(a.stats.yards+a.stats.td*100))[0];state.awards.push({year:state.year,mvp:best.name});for(let p of state.players){p.age++;p.years--;p.rating=Math.max(45,Math.min(99,p.rating+(p.age<29?rand(0,3):rand(-4,1))));if(p.age>36&&Math.random()<.35){state.retired.push({...p,retiredYear:state.year});p.team=-2}else if(p.years<=0){p.team=-1;p.years=1}p.stats={yards:0,td:0,tackles:0,sacks:0}}state.year++;state.week=1;state.results=[];state.cash+=35;state.news.unshift('New season '+state.year+' has begun!');save();render()}
function scouting(){return title('Scouting Board',state.players.filter(p=>p.team===-1).length+' prospects available · '+state.players.filter(p=>p.target).length+' targets flagged','DRAFT CLASS SCOUTING')+'<input class="input wide" placeholder="Search prospects by name..." value="'+search+'" oninput="search=this.value;render()">'+filters()+'<div class="filters">'+[0,65,70,75,80,85].map(v=>'<button class="'+(ratingFilter===v?'selected':'')+'" onclick="ratingFilter='+v+';render()">'+(v?v+'+':'Any')+'</button>').join('')+'<button onclick="targetsOnly=!targetsOnly;render()">☆ Targets Only</button></div>'+listed(state.players.filter(p=>p.team===-1)).sort((a,b)=>b.rating-a.rating).map(p=>playerRow(p,'target('+p.id+')',p.target?'★':'☆')).join('')}
function target(id){let p=state.players[id];p.target=!p.target;save();render()}
function draft(){return title('Fantasy Draft',state.draftDone?'Every roster is set. Prepare for the season.':'Choose players to build your franchise.','DRAFT ROOM')+'<div class="grid">'+metric('Picks made',state.draftDone?(TEAMS.length*30)+'/'+(TEAMS.length*30):'In progress')+metric('Your roster',roster().length)+metric('Payroll',money(payroll()))+metric('Cap space',money(capspace()))+'</div>'+filters()+listed(state.players.filter(p=>p.team===-1)).slice(0,40).map(p=>playerRow(p,'sign('+p.id+')','Draft')).join('')+(state.draftDone?'<button onclick="state.draftDone=false;save();render()">Open supplemental draft</button>':'')}
function draftBoard(){let prospects=state.players.filter(p=>p.team===-1);return title('Draft Board',prospects.length+' draftable prospects · '+prospects.filter(p=>p.target).length+' targets flagged','DRAFT WAR ROOM')+'<div class="grid three">'+POS.map(pos=>'<div><h3>'+pos+'</h3>'+prospects.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating).slice(0,8).map(p=>'<div class="card" style="margin-bottom:10px"><div class="row">'+rating(p)+'<b>'+p.name+'</b><button onclick="target('+p.id+')">'+(p.target?'★':'☆')+'</button></div><p class="muted small">Age '+p.age+' · POT '+p.pot+'</p>'+['Speed','Awareness','Agility'].map((x,i)=>'<div class="small muted">'+x+'<div class="progress"><i style="width:'+(p.rating-i*5)+'%"></i></div></div>').join('')+'<input class="input" placeholder="Personal note..." value="'+(state.scoutNotes[p.id]||'')+'" onchange="state.scoutNotes['+p.id+']=this.value;save()"></div>').join('')+'</div>').join('')+'</div>'}
function rosterPage(){return title('Active Roster',roster().length+' players · '+money(payroll())+' payroll · '+money(capspace())+' cap space','ROSTER MANAGEMENT')+POS.map(pos=>heading(pos+' ('+roster().filter(p=>p.pos===pos).length+')')+roster().filter(p=>p.pos===pos).map(p=>playerRow(p,'release('+p.id+')','List')).join('')).join('')}
function release(id){let p=state.players.find(x=>String(x.id)===String(id));if(!p||p.team!==state.team)return;if(!confirm('List '+p.name+' as a free agent?'))return;p.team=-1;save();render()}function sign(id){let p=state.players.find(x=>String(x.id)===String(id));if(!p||p.team!==-1)return;if(state.cash<p.salary*1.8)return notice('Insufficient cash');if(capspace()<p.salary)return notice('Not enough salary cap room');state.cash-=p.salary*1.8;p.team=state.team;state.news.unshift(TEAMS[state.team][1]+' signed '+p.name);save();render()}
function office(){let upgrades=[['Stadium',30,'+15% ticket revenue'],['Marketing',25,'+15% merchandise sales'],['Coaching',40,'+3 coaching rating'],['Facilities',35,'+10% injury recovery']];let kits=[['Medic Kit',40,'Faster injury recovery'],['Scout Kit',35,'Reveal prospect potentials'],['Cap Relief Kit',50,'+15% salary cap'],['Hype Kit',45,'More fan demand'],['Conditioning Kit',55,'Lower injury risk']];return title('Team Management','Invest in facilities, coaching and player contracts to grow your franchise.','FRONT OFFICE')+'<div class="grid">'+metric('Cash',money(state.cash))+metric('Cap space',money(capspace()))+metric('Coaching',state.coach)+metric('Coach points',state.upgrades.points||25)+'</div>'+heading('TEAM IDENTITY')+'<div class="card"><label>Primary jersey color <input class="input" type="color" id="primaryColor" value="'+(state.primaryColor||'#1d4ed8')+'"></label> &nbsp; <label>Accent color <input class="input" type="color" id="accentColor" value="'+(state.accentColor||'#0f172a')+'"></label> <button class="primary" onclick="state.primaryColor=$(&#39;primaryColor&#39;).value;state.accentColor=$(&#39;accentColor&#39;).value;save();notice(&#39;Team identity saved&#39;)">Save Identity</button></div>'+heading('FACILITY UPGRADES')+'<div class="grid">'+upgrades.map(([n,c,d])=>'<div class="card"><h3>'+n+'</h3><p class="muted">'+d+'</p><p>Tier '+(state.upgrades[n]||0)+'/3 · '+money(c)+'</p><button class="primary" onclick="upgrade(\''+n+'\','+c+')">Upgrade</button></div>').join('')+'</div>'+heading('COACHING PROGRAM')+'<div class="grid two">'+['Stadium Revenue','Player Development'].map(n=>'<div class="card"><h3>'+n+'</h3><p class="muted">Spend coaching points to improve franchise performance</p><button class="blue" onclick="train(\''+n+'\')">Train · 3 pts</button></div>').join('')+'</div>'+heading('TEAM KITS (POWER-UPS)')+'<div class="grid three">'+kits.map(([n,c,d])=>'<div class="card"><h3>'+n+'</h3><p class="muted">'+d+'</p><p>Cost '+money(c)+'</p><button class="primary" onclick="upgrade(\''+n+'\','+c+')">Buy</button></div>').join('')+'</div>'+heading('CONTRACT RENEGOTIATIONS')+roster().filter(p=>p.years===1).map(p=>playerRow(p,'extend('+p.id+')','Extend')).join('')}
function upgrade(n,c){if(state.cash<c)return notice('Not enough cash');if((state.upgrades[n]||0)>=3)return notice('Maximum level');state.cash-=c;state.upgrades[n]=(state.upgrades[n]||0)+1;if(n==='Coaching')state.coach+=3;if(n==='Cap Relief Kit')state.cap*=1.15;save();render()}function train(n){if((state.upgrades.points||25)<3)return notice('Not enough points');state.upgrades.points=(state.upgrades.points||25)-3;state.upgrades[n]=(state.upgrades[n]||0)+1;save();render()}function extend(id){let p=state.players.find(x=>String(x.id)===String(id));if(!p||p.team!==state.team)return;const next=+(p.salary*1.1).toFixed(1);if(capspace()+p.salary<next)return notice('Not enough cap room');p.years+=3;p.salary=next;save();render()}
function market(){return title('Player Market','Cash '+money(state.cash)+' · Cap space '+money(capspace())+' — fees scale with demand and market value.','TRANSFER MARKET')+filters()+heading('AVAILABLE FROM RIVAL CLUBS')+'<div class="card muted">No rival players listed right now.</div>'+heading('FREE AGENTS')+listed(state.players.filter(p=>p.team===-1)).sort((a,b)=>b.rating-a.rating).map(p=>playerRow(p,'sign('+p.id+')','Sign')).join('')}
function trade(){let other=state.selectedTrade;let choices=TEAMS.map((t,i)=>i===state.team?'':'<button class="'+(other===i?'white':'')+'" onclick="state.selectedTrade='+i+';tradeIn=[];render()">'+t[0]+'</button>').join('');let a=tradeOut.map(id=>state.players[id]),b=tradeIn.map(id=>state.players[id]),val=x=>x.reduce((s,p)=>s+p.salary*1.8,0);return title('Propose a Trade','AI general managers accept deals that match or beat the trade value they send out.','TRADE CENTER')+(state.week>12?'<p class="notice">🔒 The trade deadline has passed (Week 12). Trades are frozen until next season.</p>':'')+'<div class="filters">'+choices+'</div><div class="grid two"><div>'+heading('YOU SEND · '+money(val(a)))+roster().map(p=>playerRow(p,'selectTrade('+p.id+',0)',tradeOut.includes(p.id)?'✓':'Add')).join('')+'</div><div>'+heading(TEAMS[other][0]+' SENDS · '+money(val(b)))+roster(other).map(p=>playerRow(p,'selectTrade('+p.id+',1)',tradeIn.includes(p.id)?'✓':'Add')).join('')+'</div></div><div class="card"><h3>TRADE MACHINE</h3><p>You send '+money(val(a))+' · They send '+money(val(b))+'</p><p class="muted">Salary cap after trade: '+money(capspace()+a.reduce((s,p)=>s+p.salary,0)-b.reduce((s,p)=>s+p.salary,0))+'</p><button class="primary" '+(state.week>12?'disabled':'')+' onclick="executeTrade()">Propose Trade</button></div>'}
function selectTrade(id,side){let arr=side?tradeIn:tradeOut;let ix=arr.indexOf(id);ix<0?arr.push(id):arr.splice(ix,1);render()}function executeTrade(){if(!tradeOut.length||!tradeIn.length)return notice('Select players on both sides');let a=tradeOut.reduce((s,id)=>s+state.players[id].salary*1.8,0),b=tradeIn.reduce((s,id)=>s+state.players[id].salary*1.8,0);if(a<b*.95)return notice('Trade rejected: offer value too low');for(let id of tradeOut)state.players[id].team=state.selectedTrade;for(let id of tradeIn)state.players[id].team=state.team;tradeOut=[];tradeIn=[];state.news.unshift('Trade completed with '+TEAMS[state.selectedTrade][1]);save();render()}
function salary(){return title('Salary Cap','Manage contracts and available payroll space.','FINANCIAL CONTROL')+'<div class="grid">'+metric('Salary cap',money(state.cap))+metric('Team payroll',money(payroll()))+metric('Cap space',money(capspace()))+metric('Roster spots',roster().length)+'</div>'+heading('CONTRACTS')+roster().sort((a,b)=>b.salary-a.salary).map(p=>playerRow(p)).join('')}
function schedule(){let games=state.results.filter(g=>g.year===state.year&&g.week===selectedWeek);return title('Schedule','Currently on week '+state.week+' of 18.','REGULAR SEASON')+'<button class="primary" onclick="simulate()">Simulate Week '+state.week+'</button><div class="filters">'+Array.from({length:18},(_,i)=>'<button class="'+(selectedWeek===i+1?'selected':'')+'" onclick="selectedWeek='+(i+1)+';render()">'+(i+1)+'</button>').join('')+'</div><div class="grid two">'+(games.length?games.map(g=>'<div class="card row"><div>'+TEAMS[g.a][1]+'<br><br>'+TEAMS[g.b][1]+'</div><div><b>'+g.sa+'</b><br><br><b>'+g.sb+'</b></div></div>').join(''):'<div class="card muted">Week '+selectedWeek+' has not been simulated.</div>')+'</div>'}
function standings(){return title('Standings & Leaders',state.year+' · Week '+state.week,'LEAGUE TABLE')+'<div class="grid two">'+['Union North','Union South','Liberty East','Liberty West'].map(div=>'<div class="card"><h3>'+div+'</h3><table class="table">'+TEAMS.map((t,i)=>({...t,i})).filter(x=>x[2]===div).sort((a,b)=>record(b.i).w-record(a.i).w).map(t=>'<tr><td>'+t[0]+'</td><td>'+t[1]+'</td><td>'+record(t.i).w+'-'+record(t.i).l+'</td></tr>').join('')+'</table></div>').join('')+'</div>'+heading('STATISTICAL LEADERS')+'<div class="grid three">'+[['Passing yards','QB','yards'],['Rushing / receiving yards','RB','yards'],['Touchdowns','WR','td'],['Tackles','LB','tackles'],['Sacks','DL','sacks']].map(([n,pos,key])=>'<div class="card"><h3>'+n+'</h3>'+state.players.filter(p=>p.pos===pos).sort((a,b)=>b.stats[key]-a.stats[key]).slice(0,5).map(p=>'<p class="row"><span>'+p.name+'</span><b>'+p.stats[key]+'</b></p>').join('')+'</div>').join('')+'</div>'}
function awards(){let best=key=>[...state.players].sort((a,b)=>b.stats[key]-a.stats[key])[0];return title('End-of-Season Awards','Computed live from cumulative season stats.','SEASON HONORS')+'<div class="grid two">'+[['Most Valuable Player',best('yards')],['Offensive Player of the Year',best('td')],['Defensive Player of the Year',best('tackles')],['Rookie of the Year',state.players.filter(p=>p.age<=22).sort((a,b)=>b.rating-a.rating)[0]]].map(([n,p])=>'<div class="card"><div class="eyebrow">🏅 '+n+'</div><h2>'+p.name+'</h2>'+rating(p)+' <span class="muted">'+p.pos+' · Age '+p.age+'</span><p>'+p.stats.yards+' yards · '+p.stats.td+' TD · '+p.stats.tackles+' tackles</p></div>').join('')+'</div>'}
function finances(){let rev=+(12+(state.upgrades.Stadium||0)*2+(state.upgrades.Marketing||0)*2).toFixed(1),profit=rev-payroll()/18;return title('Team Finances','Figures reflect the most recently played game week.','FRONT OFFICE')+'<div class="grid three">'+metric('Cash',money(state.cash))+metric('Weekly revenue',money(rev))+metric('Weekly profit',money(profit))+'</div><div class="grid two" style="margin-top:22px"><div class="card"><h3>REVENUE STREAMS (WEEKLY)</h3><p>Ticket revenue '+money(rev*.37)+'</p><p>Sponsorship revenue '+money(rev*.17)+'</p><p>Merchandise revenue '+money(rev*.13)+'</p><p>TV revenue '+money(rev*.33)+'</p></div><div class="card"><h3>COSTS</h3><p>Player payroll (weekly) '+money(payroll()/18)+'</p><p>Season payroll '+money(payroll())+'</p><p>Coaching '+money(state.coach*.16)+'</p><p>Facilities '+money(16)+'</p></div></div>'+heading('SALARY CAP SPENDING')+'<div class="card"><div class="row"><b>Your Team '+money(payroll())+'</b><span>Cap '+money(state.cap)+'</span></div><div class="progress"><i style="width:'+Math.min(100,payroll()/state.cap*100)+'%"></i></div></div>'+heading('LEAGUE CASH STANDINGS')+TEAMS.map((t,i)=>'<div class="player">'+t[0]+' &nbsp; '+t[1]+' <strong style="margin-left:auto">'+money(160+i*9)+'</strong></div>').join('')}
function history(){return title('League History','Champions, award winners and franchise milestones are recorded here.','ARCHIVES')+'<div class="grid three">'+metric('Current season',state.year)+metric('Franchise',TEAMS[state.team][1])+metric('Clubs',TEAMS.length)+'</div>'+heading('CHAMPIONSHIP ROLL')+'<div class="card">'+(state.history.length?state.history.map(h=>'<p>'+h.year+' &nbsp; <b>'+h.champ+'</b> def. '+h.runner+'</p>').join(''):'<p class="muted">Complete a season to record your first champion.</p>')+'</div><button class="danger" style="margin-top:35px" onclick="reset()">Delete Franchise</button>'}
function legends(){return title('League Legends','Every player who hung up their cleats, with their final career numbers and years of service.','ARCHIVES')+heading('CLASS OF '+(state.year-1))+'<div class="grid three">'+(state.retired.length?state.retired.map(p=>'<div class="card">'+rating(p)+' <b>'+p.name+'</b><p class="muted">'+p.pos+' · Retired '+p.retiredYear+'</p><p>'+p.stats.yards+' yards · '+p.stats.td+' TD</p></div>').join(''):'<div class="card muted">No retired players yet. Simulate more seasons to build league history.</div>')+'</div>'}
function hall(){let ranked=[...state.retired].sort((a,b)=>b.stats.yards-a.stats.yards);return title('Hall of Fame',"The league's all-time greats, ranked by career totals once they retire.",'ARCHIVES')+'<div class="grid three">'+metric('Inductees',ranked.length)+metric('All-time yards',ranked[0]?.name||'—')+metric('All-time TDs',ranked[0]?.stats.td||0)+'</div>'+heading('TOTAL YARDS · TOUCHDOWNS · LONGEVITY')+(ranked.length?ranked.map(p=>playerRow(p)).join(''):'<div class="card muted">Hall of Fame inductees appear after eligible players retire.</div>')}
function reset(){if(confirm('Delete all franchise progress? This cannot be undone.')){state=fresh();save();go(0)}}
function animationPage(){return '<div class="card" style="max-width:760px;margin:auto;text-align:center;padding:30px;background:linear-gradient(135deg,#112c48,#101524);border:1px solid #21a38a"><h1>DRAFT NIGHT ANIMATION</h1><p>Watch the 24-second first overall pick broadcast, including the walk, jersey handoff and celebration.</p><button class="primary" style="padding:18px 32px;font-size:17px" onclick="window.playDraftAnimationPreview()">▶ PLAY ANIMATION</button></div>'}
function render(){nav();$('mobileSeason').textContent=state.year+' W'+state.week;const views={'Dashboard':dashboard,'Fantasy Draft':draft,'Scouting':scouting,'Draft Board':draftBoard,'Roster':rosterPage,'Front Office':office,'Player Market':market,'Trade Center':trade,'Salary Cap':salary,'Schedule':schedule,'Standings':standings,'Awards':awards,'Finances':finances,'League History':history,'Legends':legends,'Hall of Fame':hall,'Animation':animationPage};$('app').innerHTML=(views[page]||dashboard)()}render();
</script><script src="franchise-systems.js"></script><script src="expansion.js"></script><script src="engine.js"></script><script src="frontoffice.js"></script><script src="dashboard.js"></script><script src="playoffs.js"></script><script src="freeagency.js"></script><script src="first-pick-broadcast.js"></script><script src="draftnight.js"></script><script src="contracts.js"></script><script src="gameplay.js"></script><script src="franchise-integration.js"></script><script src="weekly-report.js"></script><script src="cap-management.js"></script><script src="menu.js"></script><script src="championship.js"></script></body></html>
